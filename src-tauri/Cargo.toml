[package]
name = "noteon"
version = "0.1.0"
description = "A Markdown editor inspired by Typora"
authors = ["kk"]
edition = "2024"

[lib]
name = "noteon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
base64 = "0.22"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
